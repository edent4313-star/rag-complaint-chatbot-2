name: CI

on:
  push:
    branches: ["main", "develop", "TASK-*", "Task-*"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ────────────────────────────────────────────────────────────────
  # Job 1 — Backend: lint + pytest
  # ────────────────────────────────────────────────────────────────
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # Install lightweight CI deps — heavy ML libs are mocked in conftest.py
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            flask \
            flask-cors \
            pandas \
            numpy \
            pyarrow \
            python-dotenv \
            torch \
            sentence-transformers \
            faiss-cpu \
            transformers \
            accelerate \
            pytest==8.3.5 \
            pytest-flask==1.3.0 \
            pytest-mock==3.14.0 \
            pytest-cov==6.1.0 \
            flake8==7.2.0

      # Strict syntax errors only (E9, F63, F7, F82)
      - name: Lint — syntax errors
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      # Full style pass — warnings only, non-blocking
      - name: Lint — style warnings
        run: |
          flake8 . \
            --count \
            --max-line-length=100 \
            --ignore=E501,W503 \
            --exclude=__pycache__,venv,.venv,tests/conftest.py \
            --statistics
        continue-on-error: true

      - name: Run pytest
        run: |
          python -m pytest \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -v

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ────────────────────────────────────────────────────────────────
  # Job 2 — Frontend: lint + vitest
  # ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["22"]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint
        continue-on-error: true

      - name: Run Vitest
        run: npm test

      - name: Run Vitest with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ────────────────────────────────────────────────────────────────
  # Job 3 — Build check
  # ────────────────────────────────────────────────────────────────
  build:
    name: Frontend build check
    runs-on: ubuntu-latest
    needs: frontend

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
